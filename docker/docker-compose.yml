version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: arlink-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: arlink
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-arlink_secure_2026}
      POSTGRES_DB: arlink_v2
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db:/docker-entrypoint-initdb.d
    ports:
      - "5433:5432"
    networks:
      - arlink-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U arlink -d arlink_v2"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: arlink-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "6380:6379"
    networks:
      - arlink-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # NestJS Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: arlink-backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://arlink:${POSTGRES_PASSWORD:-arlink_secure_2026}@postgres:5432/arlink_v2
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-arlink_jwt_secret_2026_very_secure}
      JWT_EXPIRES_IN: 24h
      CORS_ORIGINS: https://arlink.online,https://www.arlink.online
      PORT: 3000
    ports:
      - "3001:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - arlink-network
    volumes:
      - uploads_data:/app/uploads

  # React Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: arlink-frontend
    restart: unless-stopped
    environment:
      VITE_API_URL: https://api.arlink.online
    ports:
      - "8080:80"
    depends_on:
      - backend
    networks:
      - arlink-network

  # Nginx Reverse Proxy (optional, can use host nginx)
  # nginx:
  #   image: nginx:alpine
  #   container_name: arlink-nginx
  #   restart: unless-stopped
  #   ports:
  #     - "80:80"
  #     - "443:443"
  #   volumes:
  #     - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
  #     - ./nginx/conf.d:/etc/nginx/conf.d:ro
  #     - /etc/letsencrypt:/etc/letsencrypt:ro
  #   depends_on:
  #     - backend
  #     - frontend
  #   networks:
  #     - arlink-network

networks:
  arlink-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  uploads_data:
